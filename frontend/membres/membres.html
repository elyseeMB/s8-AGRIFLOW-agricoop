          <a href="#layout" class="nav-item">

                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"

                stroke-linejoin="round"

              >
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>

            <span>Livraisons</span>

          <a href="#layout" class="nav-item">

      <main class="layout__main">
        <header class="topbar">
          <div class="topbar-main">
            <h1>Gestion paiements</h1>
            <div class="topbar-actions">
              <button class="btn btn__primary btn__icon" type="button">
                Nouveau paiement
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M5 12h14"></path>
                  <path d="M12 5v14"></path>
                </svg>
              </button>
              <div class="topbar-profile">
                <div class="topbar-avatar">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                  </svg>
                </div>
                <div class="topbar-profile-info">
                  <strong>Administrateur</strong>
                  <span>Secrétaire</span>
                </div>
              </div>
            </div>
          </div>
          <div class="breadcrumb">
            <span>Accueil</span>
            <span>/</span>
            <strong>Gestion paiements</strong>
          </div>
        </header>

        <div class="page-content">
          <!-- =====================================================================
               FILTRES — TODO (Dev FS2)
               Construire une zone de filtrage : un sélecteur de statut et un champ
               de recherche par nom. Layout responsive.

               *** NE PAS MODIFIER les id ci-dessous — main.js les utilise ***
               ===================================================================== -->
          <section class="filters-bar">
            <div class="filter-group">
              <label for="filtre-statut">Filtrer par statut :</label>

              <select id="filtre-statut">
                <option value="">Tous</option>
                <option value="À jour">À jour</option>
                <option value="En retard">En retard</option>
              </select>
            </div>

            <div class="filter-group search-group">
              <label for="champ-recherche-membre">Rechercher :</label>

              <div class="search-box">
                <span class="search-icon">🔍</span>
                <input
                  type="text"
                  id="champ-recherche-membre"
                  placeholder="Rechercher un membre..."
                />
              </div>
            </div>
          </section>

          <!-- =====================================================================
               LISTE DES MEMBRES — TODO (Dev FS2)
               Le contenu est injecté par main.js. Le dev doit structurer le
               conteneur et styliser les éléments .membre-ligne, .badge.

               *** NE PAS MODIFIER l'id ci-dessous — main.js l'utilise ***
               ===================================================================== -->
          <section class="membres-section">
            <div class="membres-header">
              <span>Nom</span>
              <span>Village</span>
              <span>Téléphone</span>
              <span>Statut</span>
              <span>Solde</span>
            </div>

            <div id="liste-membres"></div>

            <div id="liste-membres-vide" class="empty-state" hidden>Aucun membre trouvé.</div>
          </section>

          <!-- =====================================================================
               NOUVEAU MEMBRE — TODO (Dev FS2)
               *** NE PAS MODIFIER les id ci-dessous — main.js les utilise ***
               ===================================================================== -->
          <section class="card new-member-panel">
            <h2>Ajouter un nouveau membre</h2>

            <form id="form-nouveau-membre" class="new-member-form">
              <div class="form-group">
                <input type="text" id="nm-prenom" placeholder="Prénom" required />
              </div>

              <div class="form-group">
                <input type="text" id="nm-nom" placeholder="Nom" required />
              </div>

              <div class="form-group">
                <select id="nm-village" required>
                  <option value="">-- Choisir un village --</option>
                </select>
              </div>

              <div class="form-group">
                <input type="text" id="nm-contact" placeholder="Contact (téléphone)" required />
              </div>

              <button type="submit" class="btn btn__primary">Créer le membre</button>
            </form>

            <div id="erreurs-nouveau-membre" class="message message-error" hidden></div>
            <div id="message-succes-nouveau-membre" class="message message-success" hidden></div>
          </section>
        </div>
      </main>
    </div>

    <script src="../functions.js"></script>
    <script src="../main.js"></script>
  </body>
</html>
