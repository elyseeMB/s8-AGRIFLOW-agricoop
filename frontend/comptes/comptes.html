<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriCoop Connect — Gestion des comptes</title>
  <link rel="stylesheet" href="comptes.css">
</head>
<body>

  <div class="mise-en-page">

    <!-- =====================================================================
         SIDEBAR — TODO (Dev FS2)
         *** NE PAS MODIFIER les id ci-dessous — main.js les utilise ***
         initBarreSession() lit #utilisateur-connecte (texte "Connecté(e) :
         nom (rôle)") et attache le clic de déconnexion sur #btn-deconnexion.
         ===================================================================== -->
    <aside class="sidebar">
      <div class="sidebar-logo">Agriflow</div>

      <nav class="sidebar-liens">
        <a href="../dashboard/dashboard.html">Tableau de bord</a>
        <a href="../membres/membres.html">Membres</a>
        <a href="../livraisons/livraisons.html">Livraisons</a>
        <a href="../paiements/paiements.html">Paiements</a>
        <a href="../ventes/ventes.html">Ventes &amp; Stock</a>
        <a href="../statistiques/statistiques.html">Statistiques</a>
        <a href="comptes.html" class="sidebar-actif">Comptes</a>
      </nav>

      <div class="sidebar-session">
        <p id="utilisateur-connecte">Non connecté(e)</p>
        <button type="button" id="btn-deconnexion">Déconnexion</button>
      </div>
    </aside>

    <main>
      <!-- =====================================================================
           RÉSERVÉ À LA SECRÉTAIRE — TODO (Dev FS2)
           initComptes() écrit ici avec .textContent selon le cas :
           "Vous devez être connecté(e)..." ou "Accès réservé à la Secrétaire."

           *** NE PAS MODIFIER l'id ci-dessous ***
           ===================================================================== -->
      <div id="acces-refuse-comptes" hidden></div>

      <h1>Gestion des comptes</h1>

      <!-- =====================================================================
           FORMULAIRE NOUVEAU COMPTE — TODO (Dev FS2)
           *** NE PAS MODIFIER les id ci-dessous — main.js les utilise ***
           ===================================================================== -->
      <form id="form-nouveau-compte">
        <h2>Créer un nouveau compte</h2>

        <label for="c-nom-utilisateur">Nom d'utilisateur</label>
        <input type="text" id="c-nom-utilisateur" placeholder="Nom d'utilisateur" required>

        <label for="c-mot-de-passe">Mot de passe temporaire</label>
        <input type="password" id="c-mot-de-passe" placeholder="Mot de passe temporaire" required>

        <label for="c-nom-complet">Nom complet</label>
        <input type="text" id="c-nom-complet" placeholder="Nom complet" required>

        <label for="c-role">Rôle</label>
        <select id="c-role" required>
          <option value="">-- Choisir un rôle --</option>
          <option value="Président">Président</option>
          <option value="Trésorière">Trésorière</option>
          <option value="Responsable dépôt">Responsable dépôt</option>
          <option value="Membre">Membre</option>
        </select>

        <button type="submit">Créer le compte</button>
      </form>

      <div id="message-erreur-compte" hidden></div>
      <div id="message-succes-compte" hidden></div>

      <!-- =====================================================================
           LISTE DES COMPTES EXISTANTS — TODO (Dev FS2)
           chargerComptes() injecte des <tr><td>nom_utilisateur</td>
           <td>nom_complet</td><td>role</td></tr> dans #liste-comptes.

           *** NE PAS MODIFIER l'id ci-dessous ***
           ===================================================================== -->
      <h2>Comptes existants</h2>
      <table>
        <thead>
          <tr>
            <th>Nom d'utilisateur</th>
            <th>Nom complet</th>
            <th>Rôle</th>
          </tr>
        </thead>
        <tbody id="liste-comptes"></tbody>
      </table>
    </main>

  </div>

  <!-- NE PAS MODIFIER — scripts de connexion au backend -->
  <script src="../functions.js"></script>
  <script src="../main.js"></script>
</body>
</html>
