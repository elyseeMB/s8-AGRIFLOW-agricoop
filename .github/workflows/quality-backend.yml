name: Quality backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup
        with:
          node: 'false'
          python: 'true'
      - name: Check
        run: black --check .
