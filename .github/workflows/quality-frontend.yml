name: Quality frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup
        with:
          node: "true"
          python: "false"
      - name: Check
        run: npx prettier --check .
